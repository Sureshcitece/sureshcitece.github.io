  function getPlatform() {
    const platform =
        navigator.userAgentData?.platform ||
        navigator.platform ||
        "";

    console.log("Raw browser platform:", platform);

    if (/Win/i.test(platform)) {
        return "Windows";
    }

    if (/Mac/i.test(platform)) {
        return "macOS";
    }

    if (/Android/i.test(platform)) {
        return "Android";
    }

    if (/iPhone|iPad|iPod/i.test(platform)) {
        return "iOS";
    }

    return "Unknown";
}

const customerPlatform = getPlatform();
console.log("Dected platform:", customerPlatform);
